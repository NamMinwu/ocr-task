spring:
  # 저장소에 커밋되지 않는 로컬 설정. 없으면 무시된다(optional).
  config:
    import: "optional:file:./application-local.yml"
  main:
    web-application-type: none
    banner-mode: "off"
logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level %msg%n"
  level:
    root: WARN
    com.dreamtrue.ocr: INFO

ocr:
  input-dir: ./input
  output-dir: ./output
  folder-number: 1
  file-number: 1
  claude:
    model: claude-opus-5
    max-tokens: 16000
    # 비워 두면 ANTHROPIC_API_KEY 환경변수를 사용한다.
    api-key: ""
  google:
    credentials-path: ./credentials/service-account.json
    spreadsheet-id: ""
    drive-folder-id: ""
