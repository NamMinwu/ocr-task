[versions]
springBoot     = "4.1.1"
dependencyMgmt = "1.1.7"
lombok         = "1.18.44"
anthropic      = "2.34.0"
googleSheets   = "v4-rev20250603-2.0.0"
googleDrive    = "v3-rev20260428-2.0.0"
googleAuth     = "1.48.0"
googleApiClient = "2.8.0"
googleOauthJetty = "1.36.0"
mockwebserver  = "4.12.0"

[libraries]
anthropic        = { module = "com.anthropic:anthropic-java",            version.ref = "anthropic" }
google-sheets    = { module = "com.google.apis:google-api-services-sheets", version.ref = "googleSheets" }
google-drive     = { module = "com.google.apis:google-api-services-drive",  version.ref = "googleDrive" }
google-auth      = { module = "com.google.auth:google-auth-library-oauth2-http", version.ref = "googleAuth" }
google-apiclient = { module = "com.google.api-client:google-api-client",  version.ref = "googleApiClient" }
google-oauth-jetty = { module = "com.google.oauth-client:google-oauth-client-jetty", version.ref = "googleOauthJetty" }
lombok           = { module = "org.projectlombok:lombok",                version.ref = "lombok" }
mockwebserver    = { module = "com.squareup.okhttp3:mockwebserver",       version.ref = "mockwebserver" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "dependencyMgmt" }
